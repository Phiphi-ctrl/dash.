<svg
        xmlns="http://www.w3.org/2000/svg"
        viewBox="0 0 64 64"
>
    <defs>
        <!-- Morning -->
        <linearGradient
                id="morning"
                gradientUnits="userSpaceOnUse"
                x1="20"
                y1="17"
                x2="44"
                y2="17"
        >
            <stop offset="0%" stop-color="#fcd34d" />
            <stop offset="50%" stop-color="#fb923c" />
            <stop offset="100%" stop-color="#fb7185" />
        </linearGradient>

        <!-- Afternoon -->
        <linearGradient
                id="afternoon"
                gradientUnits="userSpaceOnUse"
                x1="20"
                y1="32"
                x2="36"
                y2="32"
        >
            <stop offset="0%" stop-color="#38bdf8" />
            <stop offset="50%" stop-color="#22d3ee" />
            <stop offset="100%" stop-color="#3b82f6" />
        </linearGradient>

        <!-- Night -->
        <linearGradient
                id="night"
                gradientUnits="userSpaceOnUse"
                x1="20"
                y1="47"
                x2="28"
                y2="47"
        >
            <stop offset="0%" stop-color="#818cf8" />
            <stop offset="50%" stop-color="#8b5cf6" />
            <stop offset="100%" stop-color="#9333ea" />
        </linearGradient>
    </defs>

    <path
            d="M20 17H44"
            stroke="url(#morning)"
            stroke-width="6"
            stroke-linecap="round"
    />
    <path
            d="M20 32H36"
            stroke="url(#afternoon)"
            stroke-width="6"
            stroke-linecap="round"
    />
    <path
            d="M20 47H28"
            stroke="url(#night)"
            stroke-width="6"
            stroke-linecap="round"
    />
</svg>